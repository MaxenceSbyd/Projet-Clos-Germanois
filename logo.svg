  <polygon points="86,200 106,200 96,168" fill="#2C1A0E"/>
  <polygon points="89,176 103,176 96,147" fill="#2C1A0E"/>
  <polygon points="93,154 99,154 96,124" fill="#2C1A0E"/>

  <!-- ── CYPRÈS DROIT ── -->
  <rect x="302" y="221" width="4" height="6" fill="#2C1A0E"/>
  <polygon points="291,227 317,227 304,192" fill="#2C1A0E"/>
  <polygon points="294,200 314,200 304,168" fill="#2C1A0E"/>
  <polygon points="297,176 311,176 304,147" fill="#2C1A0E"/>
  <polygon points="301,154 307,154 304,124" fill="#2C1A0E"/>

  <!-- ── PILIER GAUCHE ── -->
  <circle cx="132" cy="91" r="7" fill="#2C1A0E"/>
  <rect x="119" y="98" width="26" height="8" fill="#2C1A0E"/>
  <rect x="124" y="106" width="16" height="116" fill="#2C1A0E"/>
  <rect x="117" y="222" width="30" height="5" fill="#2C1A0E"/>

