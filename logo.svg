  <!-- Barre 1 : x=148 -->
  <rect x="146.5" y="123" width="3" height="104" fill="#2C1A0E"/>
  <polygon points="148,115 151.5,123 148,119 144.5,123" fill="#2C1A0E"/>
  <!-- Barre 2 : x=161 -->
  <rect x="159.5" y="120" width="3" height="107" fill="#2C1A0E"/>
  <polygon points="161,112 164.5,120 161,116 157.5,120" fill="#2C1A0E"/>
  <!-- Barre 3 : x=174 -->
  <rect x="172.5" y="117" width="3" height="110" fill="#2C1A0E"/>
  <polygon points="174,109 177.5,117 174,113 170.5,117" fill="#2C1A0E"/>
  <!-- Barre 4 : x=187 -->
  <rect x="185.5" y="115" width="3" height="112" fill="#2C1A0E"/>
  <polygon points="187,107 190.5,115 187,111 183.5,115" fill="#2C1A0E"/>
  <!-- Barre 5 : x=213 -->
  <rect x="211.5" y="115" width="3" height="112" fill="#2C1A0E"/>
  <polygon points="213,107 216.5,115 213,111 209.5,115" fill="#2C1A0E"/>
  <!-- Barre 6 : x=226 -->
  <rect x="224.5" y="117" width="3" height="110" fill="#2C1A0E"/>
  <polygon points="226,109 229.5,117 226,113 222.5,117" fill="#2C1A0E"/>
  <!-- Barre 7 : x=239 -->
  <rect x="237.5" y="120" width="3" height="107" fill="#2C1A0E"/>
  <polygon points="239,112 242.5,120 239,116 235.5,120" fill="#2C1A0E"/>
  <!-- Barre 8 : x=252 -->
  <rect x="250.5" y="123" width="3" height="104" fill="#2C1A0E"/>
  <polygon points="252,115 255.5,123 252,119 248.5,123" fill="#2C1A0E"/>

  <!-- ── TRAVERSES HORIZONTALES DU PORTAIL ── -->
  <rect x="145" y="162" width="110" height="3" fill="#2C1A0E"/>
  <rect x="145" y="195" width="110" height="2" fill="#2C1A0E"/>

  <!-- ── LIGNE DE SOL ── -->
  <line x1="92" y1="227" x2="308" y2="227" stroke="#2C1A0E" stroke-width="1.4"/>

  <!-- ── TEXTE "GERMANOIS" ── -->
  <text x="200" y="376" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-size="31" font-weight="700" letter-spacing="4" fill="#2C1A0E">GERMANOIS</text>

  <!-- ── FILET SOUS LE TEXTE ── -->
  <line x1="55" y1="392" x2="345" y2="392" stroke="#2C1A0E" stroke-width="0.6"/>

  <!-- ── SOUS-TITRE ── -->
  <text x="200" y="410" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="8.5" letter-spacing="3.5" fill="#2C1A0E">SAINT-GERMAIN-LAVAL · LOIRE</text>

  <!-- ── PETITS LOSANGES DÉCORATIFS ── -->
  <polygon points="44,409.5 48,405.5 52,409.5 48,413.5" fill="#2C1A0E"/>
  <polygon points="356,409.5 352,405.5 348,409.5 352,413.5" fill="#2C1A0E"/>

  <!-- ── FILETS DE PIED ── -->
  <line x1="36" y1="430" x2="364" y2="430" stroke="#2C1A0E" stroke-width="0.8"/>
  <line x1="40" y1="434" x2="360" y2="434" stroke="#2C1A0E" stroke-width="0.3"/>
