<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&amp;display=swap');
    </style>
  </defs>

  <!-- Fond parchemin chaud -->
  <rect width="400" height="470" fill="#FDFAF5"/>

  <!-- ── DOUBLE BORDURE EXTÉRIEURE ── -->
  <rect x="14" y="14" width="372" height="442" fill="none" stroke="#2C1A0E" stroke-width="1.2"/>
  <rect x="20" y="20" width="360" height="430" fill="none" stroke="#2C1A0E" stroke-width="0.4"/>

  <!-- ── EN-TÊTE : Le + filets + CLOS ── -->
  <text x="200" y="38" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-size="15" font-style="italic" fill="#2C1A0E">Le</text>
  <line x1="36" y1="52" x2="145" y2="52" stroke="#2C1A0E" stroke-width="0.8"/>
  <text x="200" y="58" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-size="11" letter-spacing="9" fill="#2C1A0E">CLOS</text>
  <line x1="255" y1="52" x2="364" y2="52" stroke="#2C1A0E" stroke-width="0.8"/>

  <!-- ── OVALE DOUBLE ── -->
  <ellipse cx="200" cy="215" rx="150" ry="135" stroke="#2C1A0E" stroke-width="1.3" fill="none"/>
  <ellipse cx="200" cy="215" rx="143" ry="128" stroke="#2C1A0E" stroke-width="0.4" fill="none"/>

  <!-- ── CYPRÈS GAUCHE ── -->
  <rect x="94" y="221" width="4" height="6" fill="#2C1A0E"/>
