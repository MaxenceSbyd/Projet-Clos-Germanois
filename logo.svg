  <circle cx="268" cy="91" r="7" fill="#2C1A0E"/>
  <rect x="255" y="98" width="26" height="8" fill="#2C1A0E"/>
  <rect x="260" y="106" width="16" height="116" fill="#2C1A0E"/>
